[project]
name = "secret-sharing-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "cryptography>=43",
    "httpx>=0.27",
    "pillow>=12.3.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
