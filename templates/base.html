<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cynderlab Secrets — burn after reading{% endblock %}</title>
  <meta name="description" content="Share a secret with a link that self-destructs after one read. Encrypted in your browser; the server never sees the key.">
  <meta name="theme-color" content="#0C1420">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cynderlab Secrets">
  <meta property="og:title" content="{% block og_title %}Share secrets that self-destruct{% endblock %}">
  <meta property="og:description" content="{% block og_description %}One link, one read, then ash. Encrypted in your browser — the server never sees the key.{% endblock %}">
  <meta property="og:url" content="{{ base_url }}{{ request.url.path }}">
  <meta property="og:image" content="{{ base_url }}/static/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.og_title() }}">
  <meta name="twitter:description" content="{{ self.og_description() }}">
  <meta name="twitter:image" content="{{ base_url }}/static/img/og.png">

  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/static/img/logo.png" alt="Cynderlab Secrets logo" height="34">
      <span class="brand-name">secret<span class="accent">.</span>cynderlab</span>
    </a>
    <nav class="site-nav">
      <a href="/how-it-works">How it works</a>
      <a href="/how-it-works#agents">For agents</a>
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p class="mono ember">// burn after reading</p>
    <nav>
      <a href="https://github.com/cynderlab/secret.cynderlab.com">Source on GitHub</a>
      <a href="/privacy">Privacy policy</a>
      <a href="/legal">Legal notice</a>
      <a href="https://cynderlab.com">cynderlab.com</a>
    </nav>
    <p class="footer-legal">CYNDERLAB DIGITAL SL · CIF B27584010 · Vic (Barcelona) ·
      <a href="mailto:hola@cynderlab.com">hola@cynderlab.com</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
